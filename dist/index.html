<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Musical Keyboard — SoundFont Arranger</title>  <script type="module" crossorigin src="./assets/index-n0zQB00v.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-tCJ4OKWa.css">
</head>
<body><main class="app"><header class="head"><h1>🎹 Musical Keyboard</h1><p>كيبورد موسيقي بمحرك SoundFont وتوزيعات MIDI متعددة المسارات</p></header><section class="panel">
<div class="toolbar"><button class="action primary" id="enable">تفعيل الصوت وتحميل الآلات</button><label class="control">مستوى الصوت <input id="volume" type="range" min="0" max="1" step=".01" value=".8"></label><label class="control">Octave <select id="octave"><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option></select></label></div>
<div class="status" id="status">اضغط «تفعيل الصوت» لتحميل بنك الآلات (حوالي 32 ميجابايت) محليًا.</div><div class="backing"><div class="backing-top"><strong>مفاتيح الإيقاعات المصاحبة</strong><span class="now" id="playing">متوقف</span></div><div class="toolbar"><label class="control">سرعة الإيقاع <input id="tempo" type="range" min="60" max="190" value="110"><b id="tempoText">110 BPM</b></label><button class="action" id="stopStyle">إيقاف المصاحبة</button></div><div class="styles" id="styles"></div></div>
<div class="toolbar"><label class="control">الآلة الرئيسية <select id="leadInstrument"><option value="0">Acoustic Grand Piano</option><option value="24">Nylon Guitar</option><option value="25">Steel Guitar</option><option value="48">Strings</option><option value="73">Flute</option><option value="104">Sitar</option><option value="109">Bag Pipe</option><option value="110">Fiddle</option><option value="111">Shanai (مزمار قريب)</option></select></label><button class="action" id="panic">إيقاف كل النغمات</button></div>
<div class="keys" id="keys"></div><div class="writer"><label for="textInput">اكتب نصًا واسمعه كنغمات</label><textarea id="textInput" rows="3" placeholder="اكتب هنا... كل حرف هيطلع نغمة"></textarea></div><div class="playback"><button class="action" id="replay">▶ إعادة عزف النص</button><button class="action" id="stopReplay">■ إيقاف</button><label class="control">الفاصل بين الحروف <input id="delay" type="range" min="70" max="700" value="180"><b id="delayText">180 ms</b></label></div>
</section><footer>يعمل محليًا بعد تثبيت المكتبات أول مرة. لا يوجد CDN أو تحميل صوتي من الإنترنت وقت التشغيل.</footer></main></body></html>
